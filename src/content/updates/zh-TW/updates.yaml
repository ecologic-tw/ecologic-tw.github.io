# 更新紀錄的手寫說明（docs/adr/0024-updates-page-and-feed.md）
# 新上架的圖鑑卡、情境題、名詞會依 published 日期自動列出，這裡只寫需要補充說明的事。
# kind：feature 功能／content 內容／fix 勘誤／notice 公告
# link：只能填站內路徑，例如 /guide/ 或 /terms/#premise
# 修訂說明（docs/adr/0025-revision-disclosure.md）：
#   about：被修訂的內容，entry/<id>、scenario/<id> 或 term/<id>；沒有 link 時自動連到該內容頁
#   impact：none 不影響先前的理解／reread 建議重新閱讀／answer-changed 正解已修正（只用於 fix）
#   summary 寫清楚改了什麼、為什麼改；和內容修訂放在同一個 PR，由同一位審核者確認
- id: updates-page
  date: 2026-09-27
  kind: feature
  title: 新增更新紀錄與訂閱
  summary: 新上架的圖鑑卡、情境題與名詞會列在這裡，也可以用 RSS／Atom 閱讀器訂閱，本站不會知道誰訂閱了。
  link: /updates/
- id: cons-013-detection-inference
  date: 2026-09-27
  kind: fix
  title: 「溪邊沒聽到蛙叫」修正進階解說
  summary: 原說明把「很有機會聽到」的推理當成否定後件，容易讓人以為調查夠多次就能推出牠們很可能不在。已改為分開說明：否定後件需要「一定會偵測到」的前提；沒偵測到是機率性的證據，強弱要看調查條件與偵測率。
  about: scenario/cons-013
  impact: reread
- id: appeal-to-authority-role
  date: 2026-09-27
  kind: content
  title: 「不當訴諸權威」補充職位與身分的界線
  summary: 摘要從「名人說的」擴大為「身分、地位或名氣」。補上何時不算這種謬誤：父母、主管在職責範圍內做決定，是給行動的理由，不是證明某件事為真；並新增主管例子，以及理論權威與實踐權威的區分。
  about: entry/appeal-to-authority
  impact: reread
- id: psychology-open-review
  date: 2026-09-29
  kind: notice
  title: 四張心理學相關的卡開放檢視，歡迎指正
  summary: 「後見之明偏誤」「框架效應」「善意詮釋與鋼人論證」「非暴力溝通」由維護者審核後先開放閱讀，尚未經具心理學背景的審核者確認；兩張偏誤卡的證據強度仍是暫定。如果你發現說明、例子或來源有誤，或願意協助覆核，歡迎透過回饋表單告訴我們。
  link: /about/#feedback
- id: privacy-wording
  date: 2026-09-29
  kind: notice
  title: 隱私說明寫得更精確
  summary: 原本寫「我們不蒐集你的資料」，改為「網站本身不蒐集」，並補充三件事：投稿選擇列名時會請你填暱稱、GitHub 上的 Issue 與 PR 是公開的、GitHub Pages 會為資訊安全記錄造訪者 IP。網站的運作方式沒有改變。另補上標題字型的授權聲明。
  link: /about/#privacy
- id: combined-challenge
  date: 2026-09-29
  kind: feature
  title: 新增綜合挑戰
  summary: 一次 5 題，混合日常生活與野生生物保育，其中有 1 題推理本身沒有問題。作答時不會馬上告訴你對錯，也不計時；全部送出後只顯示答對幾題，並附上每題的解說。作答會和一般練習一樣記錄在你的瀏覽器。
  link: /challenge/
- id: discussion-card
  date: 2026-09-29
  kind: feature
  title: 新增討論引導卡（可列印）
  summary: 把三步回應、換個位置想、常見陷阱與分歧的種類整理成一張 A4 正反兩面，可以用瀏覽器列印或另存 PDF，帶到課堂、座談或會議使用。入口在圖鑑總覽與關於頁。
  link: /toolkit/discussion/
- id: issue-map
  date: 2026-09-29
  kind: feature
  title: 新增爭點地圖題型
  summary: 一段對話裡常混著不同種類的分歧。新題型請你逐句判斷，每一句比較像事實、價值、定義還是利益分歧；分清楚之後，就知道哪些要查資料、哪些要協商。先試行 2 題，基礎與進階模式各 1 題。
  link: /scenario/daily-023/
- id: response-toolbox
  date: 2026-09-29
  kind: feature
  title: 新增「我的應對工具箱」
  summary: 答對一題、點亮一張謬誤或認知偏誤卡，那張卡的善意回應句就會收進「我的圖鑑」的工具箱，可以列印帶走。答錯時也會提醒你：每一次嘗試都算數，看完解說隨時可以回來再試。紀錄一樣只存在你的瀏覽器。
  link: /me/
- id: multi-perspective-cases
  date: 2026-09-29
  kind: feature
  title: 新增多方觀點情境
  summary: 一個虛構議題、幾位角色，先讀每個人在意什麼、擔心什麼，再練習找共同點、分清楚分歧、想想先問什麼。題目不會問你站在哪一邊。第一則是「巷口要不要畫紅線」，3 題小題都在進階模式。入口在日常生活題目列表。
  link: /cases/daily-case-01/
- id: availability-heuristic-replication
  date: 2026-09-30
  kind: content
  title: 「可得性捷思」補充經典實驗的複製困難
  summary: 新增「進階」段落：字母位置實驗與「想出 6 個或 12 個例子」的實驗，後續重複驗證都沒有得到原本的結果；同時也有後設分析支持「想起來容不容易」會影響判斷。證據強度維持中等，並補上三則來源。
  about: entry/availability-heuristic
  impact: reread
- id: survivorship-bias-evidence-meaning
  date: 2026-09-30
  kind: content
  title: 「倖存者偏誤」說明證據強度的意思
  summary: 補一段說明：本卡的「證據穩健」指這種推理錯誤在統計上成立，不代表已有研究證實人們多常犯這個錯。
  about: entry/survivorship-bias
  impact: none
- id: framing-effect-quick-check
  date: 2026-09-30
  kind: content
  title: 「框架效應」小檢核改用風險選擇的例子
  summary: 本卡的證據範圍限於風險選擇框架，原本的小檢核（優格「95% 無脂」與「含 5% 脂肪」）屬於另一種框架，因此改成「確定救活」與「確定損失」的行道樹方案。
  about: entry/framing-effect
  impact: none
