- id: subjective-meaning-term
  term: 主觀意義
  en: Speaker meaning
  definition: 本站指說話者在特定場合想傳達的意思，也稱說話者意義；不等於聽者的猜測，不是在談人生價值。
  status: reviewed
  reviewers:
    - Wang-Yi-Zhang
  sources:
    - title: Stanford Encyclopedia of Philosophy — Paul Grice
      url: https://plato.stanford.edu/entries/grice/
      supports:
        - 說話者意義與語句意義之區分；主觀意義為本站教學用語。
  updated: 2026-09-27
  aiAssisted: true

- id: objective-meaning-term
  term: 客觀意義
  en: Public linguistic meaning in context
  definition: 本站指依公共語言慣例與可共享語境可支持的理解；不代表唯一解讀、脫離語境或內容必定為真，亦非統一的理論名稱。
  status: reviewed
  reviewers:
    - Wang-Yi-Zhang
  sources:
    - title: Stanford Encyclopedia of Philosophy — Pragmatics
      url: https://plato.stanford.edu/entries/pragmatics/
      supports:
        - 語言慣例、語境與理解的關係；客觀意義為本站教學用語。
  updated: 2026-09-27
  aiAssisted: true

