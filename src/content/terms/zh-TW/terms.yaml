  aiAssisted: true

- id: confounder
  term: 干擾因子
  en: Confounder
  definition: 研究中會混淆暴露與結果因果關聯的因素，常見情況是兩者有共同原因。不能只憑同時相關就判定，也不應把因果途徑中的中介因素直接當成混淆因子；須依因果結構評估。
  status: reviewed
  reviewers:
    - Wang-Yi-Zhang
  sources:
    - title: "Howards et al. (2012). Toward a Clearer Definition of Confounding
        Revisited With Directed Acyclic Graphs."
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3530354/
      supports:
        - "混淆不能只用表面相關判定，需依因果結構評估調整；不能宣稱配對排除所有混淆。"
  updated: 2026-09-26
  aiAssisted: true

