  aiAssisted: true

- id: causation
  term: 因果
  en: Causation
  definition: 一件事確實導致另一件事發生。
  status: reviewed
  reviewers:
    - Wang-Yi-Zhang
  sources:
    - title: "Howards et al. (2012). Toward a Clearer Definition of Confounding
