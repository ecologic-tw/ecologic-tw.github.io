- id: correlation
  term: 相關
  en: Correlation
  definition: 兩件事常常一起變化。相關本身不代表其中一件造成另一件。
  status: reviewed
  reviewers:
    - Wang-Yi-Zhang
  sources:
    - title: "Howards et al. (2012). Toward a Clearer Definition of Confounding
