# PR 檢查（docs/sdd/07）。不部署；Actions 以 commit SHA 鎖版，版本註記於行尾。
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 判斷是否為純文件 PR（ADR-0028）：只改 docs/** 或根目錄 *.md（DESIGN.md 除外）時，
  # check 與 e2e 以 if 略過；略過的必要檢查在 GitHub 視為通過，不會讓 PR 卡在等待狀態。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # 手動執行（沒有 PR 基準）一律跑完整檢查
          if [ -z "$BASE_SHA" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$files"
          code=false
          if [ -z "$files" ]; then code=true; fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              DESIGN.md) code=true ;;
              docs/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "需要完整檢查：$code"

  # 純文件 PR 也要通過的輕量檢查（任何 PR 都跑，成本低）
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: git diff --check
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD
      - run: node scripts/check-doc-links.ts

  check:
    needs: changes
    # 判斷失敗時照跑完整檢查（fail-safe），避免必要檢查因略過而被視為通過
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-quality
          path: reports/content-quality.*
          retention-days: 30

  # 以含草稿的建置跑 e2e：axe 無障礙、名詞 popover 鍵盤操作、關閉 JS 可閱讀（M1 驗收）
  e2e:
    needs: changes
    # 判斷失敗時照跑完整檢查（fail-safe），避免必要檢查因略過而被視為通過
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
