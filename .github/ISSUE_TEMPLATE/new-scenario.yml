name: 投稿新情境
description: 提供新的情境題構想
title: '[投稿] '
labels: [new-scenario]
body:
  - type: markdown
    attributes:
      {
        value: '請先閱讀 docs/sdd/08-misuse-prevention.md。情境須虛構，勿含真實人名、機關、精確地點或任何個資。',
      }
  - type: dropdown
    id: theme
    attributes: { label: 主題, options: [日常生活, 野生生物保育] }
    validations: { required: true }
  - type: textarea
    id: scenario
    attributes: { label: 情境（對話或陳述） }
    validations: { required: true }
  - type: input
    id: answer
    attributes: { label: 你認為的答案, description: '謬誤／偏誤名稱，或「沒有問題」' }
  - type: textarea
    id: better
    attributes: { label: 更好的說法（選填） }
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 情境為虛構，不指涉真實人物、機關或事件
          required: true
        - label: 同意以 CC BY-SA 4.0 授權釋出
          required: true
